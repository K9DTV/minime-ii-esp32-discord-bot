# Python tooling (pytest + Pillow). Logo playwright is requirements-logo.txt (local).
# Badge: Python

name: Python

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r tools/requirements.txt

      - name: pytest
        run: pytest -q tools/test_python_ci.py tools/test_cmd_tokenize.py tools/test_body_reader.py
