# Compile + host sanity for MiniMe II (Guition JC3248W535EN / ESP32-S3).
# Does not upload or run on hardware. Local HIL soak: docs/HIL_SOAK.md

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host sanity (no board)
        run: python3 tools/ci_sanity.py

  compile:
    needs: sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "ArduinoJson@7.4.2"
          arduino-cli lib install "WebSockets"
          arduino-cli lib install "OneWire"
          arduino-cli lib install "DallasTemperature"
          arduino-cli lib install "Adafruit NeoPixel"
          arduino-cli lib install "NTPClient"
          arduino-cli lib install "GFX Library for Arduino"
          # Direct Arduino_AXS15231B path -- no JC3248W535EN-Touch-LCD wrapper.

      - name: Prepare secrets placeholder
        run: |
          cp MiniMe_Discord_Bot_II/secrets.example.h MiniMe_Discord_Bot_II/secrets.h
          # Example template trips #error until this flag is removed (same as local secrets.h).
          sed -i '/MINIME_SECRETS_IS_EXAMPLE/d' MiniMe_Discord_Bot_II/secrets.h

      - name: Compile sketch
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=custom,PSRAM=opi,CDCOnBoot=cdc" \
            MiniMe_Discord_Bot_II
