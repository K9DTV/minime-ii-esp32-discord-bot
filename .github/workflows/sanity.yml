# Host-side checks only (no Arduino, no board).
# Badge: Sanity

name: Sanity

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host sanity (no board)
        run: python3 tools/ci_sanity.py
