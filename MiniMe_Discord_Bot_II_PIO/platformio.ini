; PlatformIO build for MiniMe II.
;
; This project builds the same firmware sources as the Arduino IDE sketch in
; ../MiniMe_Discord_Bot_II, so you can pick either build system. Nothing here
; changes the sketch, docs or tools in the repository.
; https://docs.platformio.org/page/projectconf.html
;
; Hardware: Guition JC3248W535EN (ESP32-S3-N16R8: 16 MB QIO flash, 8 MB OPI
; PSRAM, AXS15231B QSPI panel). The options below mirror the Arduino IDE build
; used by upstream CI (.github/workflows/compile.yml):
;   esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=custom,PSRAM=opi,CDCOnBoot=cdc
; (flash mode stays at the esp32s3 default QIO/80 MHz), so a PlatformIO binary
; and an Arduino IDE binary behave identically.

[platformio]
default_envs = minime-ii
src_dir = src

[env:minime-ii]
; miniMe II needs Arduino-ESP32 core 3.x (the sources carry
; ESP_ARDUINO_VERSION_VAL guards and a core-version #error). The official
; PlatformIO espressif32 platform only ships core 2.x, so use the community
; pioarduino platform, which tracks upstream Arduino core releases.
; Pinned for reproducible builds: 55.03.312-1 == Arduino-ESP32 3.3.12 (IDF 5.5.5).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip

; ESP32-S3 Dev Module with 16 MB flash + 8 MB OPI PSRAM (N16R8), 80 MHz flash,
; 240 MHz CPU. This manifest supplies the real 16 MB flash size that esptool is
; invoked with; the generic esp32-s3-devkitc-1 board is only N8/no-PSRAM.
board = esp32-s3-devkitc1-n16r8
framework = arduino

; ====== Prebuilt ESP-IDF libraries for the Arduino core ======
; The pioarduino platform ships this asset as an *optional* package and relies
; on its own installer hook to enable it. When that hook does not fire,
; PlatformIO skips the package and pioarduino-build.py aborts with
;   TypeError: expected str ... not NoneType   (FRAMEWORK_LIBS_DIR)
; Declaring it here pins the exact asset (Arduino-ESP32 3.3.12 / IDF 5.5.5).
platform_packages =
    framework-arduinoespressif32-libs@https://github.com/espressif/arduino-esp32/releases/download/3.3.12/esp32-core-3.3.12-libs.tar.xz

; ====== Board: ESP32-S3 Dev Module, Flash 16 MB QIO, OPI PSRAM ======
; qio_opi = QIO flash + octal PSRAM: drives the sdkconfig flash/PSRAM split
; (CONFIG_ESPTOOLPY_FLASHMODE_QIO, CONFIG_SPIRAM_MODE_OCT) and the Arduino IDF
; lib variant used for the build. Both keys are set on purpose:
;   board_build.arduino.memory_type -> board manifest key used by the boards
;   board_build.memory_type         -> read directly by the pioarduino builder
board_build.arduino.memory_type = qio_opi
board_build.memory_type = qio_opi
board_build.psram_type = opi

; Partition table lives with the sources (single source of truth for both build
; systems). app0 is 0x7E0000; PlatformIO derives upload.maximum_size from it.
; Contents: nvs + otadata + 2x ~7.9 MB OTA apps + prefs + coredump.
board_build.partitions = src/partitions.csv

; ====== Upload ======
; USB (native USB-CDC, COMx) works out of the box:
;   pio device list
;   pio run -t upload --upload-port COMx
; For Wi-Fi OTA see README.md (upload_protocol = espota, port 3232).
upload_speed = 921600

; ====== Monitor ======
; Note: firmware logging goes to the LAN web UI, not Serial (src/serial_log.cpp).
monitor_speed = 115200
monitor_filters = direct

; ====== Build flags ======
build_flags =
    ; PSRAM enable (Arduino IDE "PSRAM: OPI PSRAM")
    -DBOARD_HAS_PSRAM
    ; USB CDC on boot (Arduino IDE "USB CDC On Boot: Enabled"; the S3 default
    ; USB Mode is "Hardware CDC and JTAG", i.e. ARDUINO_USB_MODE=1)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Loop task stack 16 KB (the 3.x hook used by the static_assert in the .ino)
    -DARDUINO_LOOP_STACK_SIZE=16384

; ====== Library dependencies ======
; Kept in step with .github/workflows/compile.yml (CI installs GFX, WebSockets,
; OneWire, DallasTemperature, Adafruit NeoPixel, NTPClient and pins
; ArduinoJson@7.4.2), and with the Arduino-ESP32 core 3.3.12 ABI.
lib_deps =
    ; JSON with ESP32 PSRAM allocator
    bblanchon/ArduinoJson@7.4.2
    ; WebSocket client for the Discord gateway (Links2004 API: WebSocketsClient.h)
    links2004/WebSockets@^2.6.0
    ; Display: Arduino_GFX (QSPI AXS15231B driver built in). 1.4.3 does not
    ; build against core 3.3.12 (removed 1-arg spiFrequencyToClockDiv).
    moononournation/GFX Library for Arduino@1.6.8
    ; Temperature sensor
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    ; NeoPixel
    adafruit/Adafruit NeoPixel@^1.12.0
    ; NTP time sync
    arduino-libraries/NTPClient@^3.2.1
    ; WiFi/UDP, SD, SPI, Wire, WebServer, ArduinoOTA ship with the ESP32 core
